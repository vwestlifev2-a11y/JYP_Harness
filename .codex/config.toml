#:schema https://developers.openai.com/codex/config-schema.json
# Project-local policy. Requires a trusted project and an active sandbox.
# Do not combine with sandbox_mode or sandbox_workspace_write in loaded configs.
default_permissions = "project-sensitive-deny"
approval_policy = "never"

[windows]
# MXC is unavailable on this device. The validated elevated sandbox supports deny-read.
# Refuse unsupported policies; never fall back to unelevated or full access.
sandbox = "elevated"

[shell_environment_policy]
ignore_default_excludes = false

[shell_environment_policy.filters]
"*CREDENTIAL*" = "exclude"
"*SECRET*" = "exclude"
"*TOKEN*" = "exclude"
"*PASSWORD*" = "exclude"
"*PRIVATE_KEY*" = "exclude"
"*API_KEY*" = "exclude"

[permissions.project-sensitive-deny]
description = "Project editing with sensitive files denied for read, write and delete."
extends = ":workspace"

[permissions.project-sensitive-deny.filesystem]
# Globs are snapshotted per process on Windows/Linux. Exact denied paths below
# protect the conventional locations; deeper matches require this bounded scan.
glob_scan_max_depth = 32

[permissions.project-sensitive-deny.filesystem.":workspace_roots"]
# Keep Git writable. Windows cannot reopen writable children under protected .agents.
# Agent policies and skills remain read-only in sandboxed sessions.
".git" = "write"
".agents/skills" = "read"
".codex" = "read"

# Stable locations: no access even when other project paths are writable.
".env" = "deny"
".env.local" = "deny"
".env.development" = "deny"
".env.production" = "deny"
".env.test" = "deny"
"harnes_engineering/.env" = "deny"
"credential" = "deny"
"credentials" = "deny"
"credentials.json" = "deny"
"secret" = "deny"
"secrets" = "deny"
"secrets.json" = "deny"
".secrets" = "deny"
".ssh" = "deny"
".aws" = "deny"
".gnupg" = "deny"
".kube" = "deny"

# All matching project descendants, including the nested repository.
"**/.[eE][nN][vV]*" = "deny"
"**/*.[eE][nN][vV]" = "deny"
"**/*.[eE][nN][vV].*" = "deny"
"**/*[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]*" = "deny"
"**/*[sS][eE][cC][rR][eE][tT]*" = "deny"
"**/.ssh" = "deny"
"**/.aws" = "deny"
"**/.gnupg" = "deny"
"**/.kube" = "deny"
"**/.npmrc" = "deny"
"**/.pypirc" = "deny"
"**/.netrc" = "deny"
"**/auth.json" = "deny"
"**/token" = "deny"
"**/token.*" = "deny"
"**/tokens" = "deny"
"**/tokens.*" = "deny"
"**/*service[-_]account*.json" = "deny"
"**/*.[pP][eE][mM]" = "deny"
"**/*.[kK][eE][yY]" = "deny"
"**/*.[pP]12" = "deny"
"**/*.[pP][fF][xX]" = "deny"
"**/*.[jJ][kK][sS]" = "deny"
"**/*.[kK][eE][yY][sS][tT][oO][rR][eE]" = "deny"
"**/id_rsa*" = "deny"
"**/id_ed25519*" = "deny"
"**/id_ecdsa*" = "deny"
"**/id_dsa*" = "deny"

[permissions.project-sensitive-deny.network]
# Preserve normal dependency/GitHub access; this profile adds no domain allowlist.
enabled = true
